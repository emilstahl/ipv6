name: CI

# No job writes to the repository — never hand install scripts or npx-fetched
# tools a write-capable GITHUB_TOKEN.
permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  validate-json:
    name: Validate ISP data against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job pushes to the repo — don't leave GITHUB_TOKEN in git config.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Validate data/*.json against schema.json
        run: npx --yes ajv-cli@5.0.0 validate -s schema.json -d "data/*.json"

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No job pushes to the repo — don't leave GITHUB_TOKEN in git config.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Audits the tree actually installed above. Gatsby 5's build-time tooling
      # carries known high-severity findings that need upstream releases, so
      # gate on critical to keep this a real signal, and report high for
      # visibility without blocking.
      - name: Audit dependencies (fails on critical)
        run: npm audit --audit-level=critical

      - name: Report high-severity backlog (informational)
        if: always()
        run: npm audit --audit-level=high || true

      - name: Unit tests
        run: npm test

      - name: Gatsby build
        run: npm run build

      - name: Sanity-check build output
        run: |
          test -f public/index.html
          grep -q "IPv6-adresse.dk" public/index.html
          test -f public/sitemap-index.xml
          test -f public/manifest.webmanifest
          grep -q "Content-Security-Policy" public/_headers
          grep -q "sha256-" public/_headers

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Serves the build from the step above (playwright.config.js webServer)
      - name: End-to-end smoke tests
        run: npm run test:e2e
