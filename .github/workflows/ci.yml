name: CI

# No job writes to the repository — never hand install scripts or npx-fetched
# tools a write-capable GITHUB_TOKEN.
permissions:
  contents: read

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  validate-json:
    name: Validate ISP data against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate data/*.json against schema.json
        run: npx --yes ajv-cli@5.0.0 validate -s schema.json -d "data/*.json"

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Gatsby build
        run: npm run build

      - name: Sanity-check build output
        run: |
          test -f public/index.html
          grep -q "IPv6-adresse.dk" public/index.html
          test -f public/sitemap-index.xml
          test -f public/manifest.webmanifest
          grep -q "Content-Security-Policy" public/_headers
          grep -q "sha256-" public/_headers

  audit:
    name: npm audit (fails on critical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Gatsby 5's build-time tooling carries known high-severity findings that
      # need upstream releases; gate on critical so this stays a real signal.
      - name: Audit dependencies (critical)
        run: npm audit --audit-level=critical

      - name: Report high/critical counts (informational)
        if: always()
        run: npm audit --audit-level=high || true

  # Weekly visibility into the high-severity backlog without blocking PRs.
  audit-scheduled:
    name: Weekly high-severity audit report
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit dependencies (high)
        run: npm audit --audit-level=high
